name: Build APK depuis ZIP

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le fichier ZIP
        uses: actions/checkout@v4

      - name: Extraire le ZIP automatiquement
        run: |
          unzip -o *.zip -d projet_extrait
          cd projet_extrait
          # Si le zip contenait un sous-dossier principal, on entre dedans
          if [ $(ls -1 | wc -l) -eq 1 ]; then cd $(ls -1); fi
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p $GITHUB_WORKSPACE/sortie_apk
          find . -name "app-debug.apk" -exec cp {} $GITHUB_WORKSPACE/sortie_apk/ \;

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sauvegarder l'APK prêt à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: Application-Releves-APK
          path: sortie_apk/app-debug.apk
